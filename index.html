<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posses HAZAQ</title>
<style>
body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
.container { max-width: 500px; margin: auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.logos img { height: 60px; display: block; margin-bottom: 10px; }
h1 { font-size: 18px; border-bottom: 2px solid #333; padding-bottom: 10px; }
.campo { margin-bottom: 12px; }
label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 4px; }
input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
.btn-link {
display: block;
background: #27ae60;
color: white;
padding: 18px;
text-align: center;
text-decoration: none;
border-radius: 4px;
font-weight: bold;
font-size: 18px;
text-transform: uppercase;
}
footer { text-align: center; margin-top: 30px; border-top: 1px solid #333; padding-top: 10px; font-size: 12px; }
</style>
</head>
<body>

<div class="container">
<header>
<img src="logo-512.png">
<h1>Posses Seminário e Amparo HAZAQ</h1>
</header>

<div class="campo">
<label>Item:</label>
<input type="text" id="item">
</div>
<div class="campo">
<label>Tipo:</label>
<select id="tipo" onchange="document.getElementById('divF').style.display=(this.value=='doado'?'block':'none')">
<option value="comprado">Comprado</option>
<option value="doado">Doado</option>
</select>
</div>
<div class="campo" id="divF" style="display:none">
<label>Fonte:</label>
<input type="text" id="fonte">
</div>
<div class="campo">
<label>Data:</label>
<input type="date" id="data">
</div>
<div class="campo">
<label>Registrador:</label>
<input type="text" id="reg">
</div>
<div class="campo">
<label>Valor R$`:</label>
<input type="number" id="val">
</div>

<a href="#" class="btn-link" onclick="gerarLink(this)">Enviar</a>

<footer>
<strong>HAZAQ</strong><br>Gilberto Moreira - MT
</footer>
</div>

<script>
function gerarLink(elemento) {
const item = document.getElementById('item').value;
const tipo = document.getElementById('tipo').value;
const fonte = document.getElementById('fonte').value || '-';
const data = document.getElementById('data').value;
const reg = document.getElementById('reg').value;
const val = document.getElementById('val').value || '0.00';

if(!item || !data || !reg) {
alert("Preencha Item, Data e Registrador!");
return false;
}

const dataBr = data.split('-').reverse().join('/');
const msg = *POSSE HAZAQ*%0A*Item:*${item}%0ATipo:{fonte}%0AValor: Rlatex
 

{val}%0AData:{reg}`;

const fone = "5566984666186";

// Altera o destino do link no momento do clique
elemento.href = https://wa.me/${fone}?text=${msg};
}
</script>

</body>
</html>
