<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posses HAZAQ</title>
<style>
body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
.container { max-width: 500px; margin: auto; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccc; }
header { text-align: left; border-bottom: 2px solid #333; margin-bottom: 15px; }
.logos img { height: 60px; }
.form-box { background: #f9f9f9; padding: 10px; border: 1px solid #ddd; }
input, select { padding: 12px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #999; font-size: 16px; }
.btn-green { background: #27ae60; color: white; padding: 18px; border: none; width: 100%; font-weight: bold; font-size: 18px; cursor: pointer; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
th, td { border: 1px solid #333; padding: 8px; text-align: left; }
th { background: #eee; }
footer { text-align: center; margin-top: 20px; font-size: 12px; border-top: 1px solid #333; }
</style>
</head>
<body>

<div class="container">
<header>
<img src="logo-512.png">
<h2 style="margin:5px 0;">Posses HAZAQ</h2>
</header>

<div class="form-box">
<input type="text" id="nome" placeholder="Nome do Item">
<select id="tipo" onchange="document.getElementById('fnt').style.display=(this.value=='doado'?'block':'none')">
<option value="comprado">Comprado</option>
<option value="doado">Doado</option>
</select>
<input type="text" id="fnt" placeholder="Doador (Quem doou?)" style="display:none">
<input type="date" id="data">
<input type="text" id="reg" placeholder="Quem está registrando?">
<input type="number" id="val" placeholder="Valor Estimado R$`">

<button type="button" class="btn-green" id="btnSalvar">REGISTRAR POSSE</button>
</div>

<table id="tabela">
<thead>
<tr><th>Item</th><th>Origem</th><th>Valor</th><th>Data</th></tr>
</thead>
<tbody id="corpo"></tbody>
</table>

<button onclick="if(confirm('Limpar tudo?')){localStorage.clear();location.reload();}" style="margin-top:20px; color:red; border:none; background:none;">[Limpar Lista]</button>

<footer>
<strong>HAZAQ</strong> - Gilberto Moreira - Mato Grosso-BR
</footer>
</div>

<script>
const btn = document.getElementById('btnSalvar');
const corpo = document.getElementById('corpo');

// Função para desenhar a tabela
function desenhar() {
corpo.innerHTML = "";
let dados = JSON.parse(localStorage.getItem('hazaq_v1')) || [];
dados.forEach(i => {
let linha = corpo.insertRow();
linha.innerHTML = <td&gt;${i.n}</td><td>

{i.d}</td>`;
});
}

// Ação do Botão
btn.onclick = function() {
const n = document.getElementById('nome').value;
const d = document.getElementById('data').value;
const r = document.getElementById('reg').value;

if(!n || !d || !r) {
alert("Preencha: Item, Data e Registrador");
return;
}

let lista = JSON.parse(localStorage.getItem('hazaq_v1')) || [];
lista.push({
n: n,
t: document.getElementById('tipo').value,
f: document.getElementById('fnt').value,
d: d.split('-').reverse().join('/'),
v: document.getElementById('val').value || '0',
r: r
});

localStorage.setItem('hazaq_v1', JSON.stringify(lista));
desenhar();

// Limpar campos básicos
document.getElementById('nome').value = "";
document.getElementById('val').value = "";
};

window.onload = desenhar;
</script>

</body>
</html>
