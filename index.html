<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

h1 { font-size: 18px; margin: 5px 0; }
.group { margin-bottom: 15px; text-align: left; }
label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; }
input, select { width: 100%; padding: 12px; border: 1px solid #999; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
.btn { display: block; width: 100%; background: #27ae60; color: white; padding: 18px; border: none; border-radius: 5px; font-weight: bold; font-size: 18px; text-transform: uppercase; cursor: pointer; text-align: center; text-decoration: none; }
